<rect x="0" y="0" width="860" height="600" fill="#ffffff"/>
      <title id="f21t">Figure 2.1 Wireframe: sign-in and registration entry page</title>
      <desc>Two provider buttons sit at the top, an email and password form sits below a divider, and the footer links to account creation.</desc>
      <rect class="box" x="0.5" y="0.5" width="859" height="599" rx="10"/>
