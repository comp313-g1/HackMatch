<rect x="0" y="0" width="860" height="560" fill="#ffffff"/>
      <title id="f32t">Figure 3.2 Wireframe: login code page</title>
      <desc>Six code input boxes, an expiry countdown, a resend entry point, and a link to use a different account.</desc>
      <rect class="box" x="0.5" y="0.5" width="859" height="559" rx="10"/>
      <line class="ln" x1="0.5" y1="34.5" x2="859.5" y2="34.5"/>
      <circle class="ph" cx="20" cy="17" r="4.5"/>
      <circle class="ph" cx="36" cy="17" r="4.5"/>
      <circle class="ph" cx="52" cy="17" r="4.5"/>
      <rect class="surf" x="70" y="7" width="380" height="20" rx="10"/>
      <text class="dim" x="82" y="17.5" font-size="11" dominant-baseline="central">hackmatch.app/auth/login-code</text>
      <rect class="surf" x="0" y="35" width="860" height="49"/>
      <line class="ln" x1="0" y1="84.5" x2="860" y2="84.5"/>
      <text x="24" y="59.5" font-size="15" font-weight="500" dominant-baseline="central">HackMatch</text>
      <rect class="box" x="230" y="100" width="400" height="420" rx="12"/>
      <text x="430" y="138" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central">Enter your login code</text>
      <text class="mut" x="430" y="164" font-size="12" text-anchor="middle" dominant-baseline="central">We sent a 6-digit code to a•••@school.edu</text>
      <rect class="box" x="273" y="194" width="44" height="52" rx="6"/>
      <text x="295" y="220" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central">4</text>
      <rect class="box" x="327" y="194" width="44" height="52" rx="6"/>
      <text x="349" y="220" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central">8</text>
      <rect class="box" x="381" y="194" width="44" height="52" rx="6"/>
      <text x="403" y="220" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
      <rect class="box" x="435" y="194" width="44" height="52" rx="6"/>
      <line class="sp" x1="450" y1="212" x2="450" y2="230" stroke-width="1.5"/>
      <rect class="box" x="489" y="194" width="44" height="52" rx="6"/>
      <rect class="box" x="543" y="194" width="44" height="52" rx="6"/>
      <text class="mut" x="430" y="272" font-size="12" text-anchor="middle" dominant-baseline="central">Code expires in 09:42</text>
      <rect class="acc" x="273" y="296" width="314" height="38" rx="6"/>
      <text class="w" x="430" y="315.5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Verify and sign in</text>
      <text class="ac" x="448" y="352" font-size="11" text-anchor="end" dominant-baseline="central">Resend code</text>
      <text class="dim" x="454" y="352" font-size="11" dominant-baseline="central">· available in 00:47</text>
      <line class="ln" x1="273" y1="382" x2="587" y2="382"/>
      <text class="ac" x="430" y="404" font-size="11" text-anchor="middle" dominant-baseline="central">Use a different account</text>
      <rect class="pan" x="253" y="428" width="354" height="64" rx="8"/>
      <text class="mut" x="267" y="452" font-size="11" dominant-baseline="central">Five incorrect codes lock sign-in for 15 minutes</text>
      <text class="mut" x="267" y="470" font-size="11" dominant-baseline="central">and invalidate this challenge.</text>
      <line class="st" x1="207" y1="220" x2="269" y2="220"/>
      <circle class="acc" cx="196" cy="220" r="11"/>
      <text class="w" x="196" y="220.5" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
      <line class="st" x1="207" y1="272" x2="269" y2="272"/>
      <circle class="acc" cx="196" cy="272" r="11"/>
      <text class="w" x="196" y="272.5" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
      <line class="st" x1="207" y1="452" x2="249" y2="452"/>
      <circle class="acc" cx="196" cy="452" r="11"/>
      <text class="w" x="196" y="452.5" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
