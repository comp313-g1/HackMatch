<rect x="0" y="0" width="860" height="580" fill="#ffffff"/>
      <title id="f31t">Figure 3.1 Wireframe: sign-in page with failure and lockout banners</title>
      <desc>A generic credential failure banner and a too-many-attempts lockout banner sit above the email and password fields and the forgot-password entry point.</desc>
      <rect class="box" x="0.5" y="0.5" width="859" height="579" rx="10"/>
      <line class="ln" x1="0.5" y1="34.5" x2="859.5" y2="34.5"/>
      <circle class="ph" cx="20" cy="17" r="4.5"/>
      <circle class="ph" cx="36" cy="17" r="4.5"/>
      <circle class="ph" cx="52" cy="17" r="4.5"/>
      <rect class="surf" x="70" y="7" width="380" height="20" rx="10"/>
      <text class="dim" x="82" y="17.5" font-size="11" dominant-baseline="central">hackmatch.app/sign-in</text>
      <rect class="surf" x="0" y="35" width="860" height="49"/>
      <line class="ln" x1="0" y1="84.5" x2="860" y2="84.5"/>
      <text x="24" y="59.5" font-size="15" font-weight="500" dominant-baseline="central">HackMatch</text>
      <text class="mut" x="590" y="59.5" font-size="12" dominant-baseline="central">Events</text>
      <text class="mut" x="658" y="59.5" font-size="12" dominant-baseline="central">Teams</text>
      <rect class="box" x="250" y="110" width="360" height="420" rx="12"/>
      <text x="430" y="146" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central">Sign in</text>
      <rect class="dgr" x="278" y="168" width="304" height="46" rx="6"/>
      <text class="dg" x="292" y="186" font-size="11" dominant-baseline="central">Email or password is incorrect.</text>
      <text class="mut" x="292" y="202" font-size="11" dominant-baseline="central">Check your details and try again.</text>
      <rect class="wrn" x="278" y="224" width="304" height="46" rx="6"/>
      <text class="wn" x="292" y="242" font-size="11" dominant-baseline="central">Too many attempts. Try again in 14:32.</text>
      <text class="mut" x="292" y="258" font-size="11" dominant-baseline="central">Password attempts are counted separately.</text>
      <text class="mut" x="278" y="294" font-size="11" dominant-baseline="central">Email</text>
      <rect class="box" x="278" y="302" width="304" height="34" rx="6"/>
      <text class="dim" x="290" y="319.5" font-size="12" dominant-baseline="central">you@example.com</text>
      <text class="mut" x="278" y="358" font-size="11" dominant-baseline="central">Password</text>
      <rect class="box" x="278" y="366" width="304" height="34" rx="6"/>
      <text class="dim" x="290" y="383.5" font-size="14" dominant-baseline="central">••••••••••</text>
      <text class="ac" x="582" y="383.5" font-size="11" text-anchor="end" dominant-baseline="central">Show</text>
      <text class="ac" x="278" y="424" font-size="11" dominant-baseline="central">Forgot password?</text>
      <rect class="acc" x="278" y="440" width="304" height="38" rx="6"/>
      <text class="w" x="430" y="459.5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Sign in</text>
      <line class="st" x1="238" y1="190" x2="274" y2="190"/>
