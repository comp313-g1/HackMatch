      <rect class="box" x="396" y="136" width="68" height="46" rx="6"/>
      <path class="st" d="M397 139 L430 164 L463 139"/>
      <text x="430" y="214" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central">Verify your email address</text>
      <text class="mut" x="430" y="240" font-size="12" text-anchor="middle" dominant-baseline="central">We sent a verification link to a•••@school.edu</text>
      <circle class="acc" cx="300" cy="282" r="10"/>
      <text class="w" x="300" y="282.5" font-size="11" text-anchor="middle" dominant-baseline="central">1</text>
      <text class="mut" x="322" y="282" font-size="12" dominant-baseline="central">Open the email from HackMatch</text>
      <circle class="acc" cx="300" cy="312" r="10"/>
      <text class="w" x="300" y="312.5" font-size="11" text-anchor="middle" dominant-baseline="central">2</text>
      <text class="mut" x="322" y="312" font-size="12" dominant-baseline="central">Click the verification link</text>
      <circle class="acc" cx="300" cy="342" r="10"/>
      <text class="w" x="300" y="342.5" font-size="11" text-anchor="middle" dominant-baseline="central">3</text>
      <text class="mut" x="322" y="342" font-size="12" dominant-baseline="central">Come back and sign in with a login code</text>
      <rect class="box" x="300" y="372" width="260" height="36" rx="6"/>
      <text class="ac" x="430" y="390.5" font-size="12" text-anchor="middle" dominant-baseline="central">Resend verification email</text>
      <text class="dim" x="430" y="424" font-size="11" text-anchor="middle" dominant-baseline="central">You can resend in 00:47</text>
