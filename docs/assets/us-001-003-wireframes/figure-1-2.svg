<rect x="0" y="0" width="860" height="620" fill="#ffffff"/>
      <title id="f12t">Figure 1.2 Wireframe: email verification gate page</title>
      <desc>The page confirms the verification email was sent, lists three steps and a resend button, and shows the features blocked while the email is unverified.</desc>
      <rect class="box" x="0.5" y="0.5" width="859" height="619" rx="10"/>
      <line class="ln" x1="0.5" y1="34.5" x2="859.5" y2="34.5"/>
