      <line class="st" x1="451" y1="180" x2="500" y2="180"/>
      <circle class="acc" cx="440" cy="180" r="11"/>
      <text class="w" x="440" y="180.5" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
