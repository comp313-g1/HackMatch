</style>
<rect x="0" y="0" width="860" height="560" fill="#ffffff"/>
      <title id="f23t">Figure 2.3 Wireframe: account linking and profile prefill</title>
      <desc>Left: re-authentication is required for the existing account. Right: first sign-in profile completion, with a prefilled avatar and handle labelled self-declared.</desc>
      <rect class="box" x="0.5" y="0.5" width="859" height="559" rx="10"/>
      <line class="ln" x1="0.5" y1="34.5" x2="859.5" y2="34.5"/>
      <circle class="ph" cx="20" cy="17" r="4.5"/>
      <circle class="ph" cx="36" cy="17" r="4.5"/>
      <circle class="ph" cx="52" cy="17" r="4.5"/>
      <rect class="surf" x="70" y="7" width="380" height="20" rx="10"/>
      <text class="dim" x="82" y="17.5" font-size="11" dominant-baseline="central">hackmatch.app/auth/link-account</text>
      <rect class="surf" x="0" y="35" width="860" height="49"/>
      <line class="ln" x1="0" y1="84.5" x2="860" y2="84.5"/>
      <text x="24" y="59.5" font-size="15" font-weight="500" dominant-baseline="central">HackMatch</text>
      <text class="mut" x="60" y="108" font-size="11" dominant-baseline="central">An account already exists for this email</text>
      <text class="mut" x="460" y="108" font-size="11" dominant-baseline="central">First sign-in: profile prefill</text>
      <rect class="box" x="60" y="120" width="340" height="400" rx="12"/>
      <circle class="wrn" cx="230" cy="180" r="24"/>
      <text class="wn" x="230" y="180.5" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central">!</text>
      <text x="230" y="234" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central">Sign in to link this account</text>
      <text class="mut" x="230" y="260" font-size="12" text-anchor="middle" dominant-baseline="central">Same email is not enough on its own.</text>
      <rect class="box" x="80" y="286" width="300" height="34" rx="6"/>
      <text class="dim" x="92" y="303.5" font-size="12" dominant-baseline="central">you@example.com</text>
      <rect class="box" x="80" y="328" width="300" height="34" rx="6"/>
      <text class="dim" x="92" y="345.5" font-size="14" dominant-baseline="central">••••••••••</text>
      <rect class="acc" x="80" y="378" width="300" height="38" rx="6"/>
      <text class="w" x="230" y="397.5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Re-authenticate and continue</text>
      <text class="dim" x="230" y="440" font-size="11" text-anchor="middle" dominant-baseline="central">A login code is still required afterwards.</text>
      <text class="dim" x="230" y="460" font-size="11" text-anchor="middle" dominant-baseline="central">Public OAuth can never grant ADMIN.</text>
      <rect class="box" x="460" y="120" width="340" height="400" rx="12"/>
      <circle class="ph" cx="530" cy="180" r="26"/>
      <text class="mut" x="572" y="174" font-size="13" dominant-baseline="central">Avatar from GitHub</text>
      <text class="dim" x="572" y="194" font-size="11" dominant-baseline="central">Prefilled, editable</text>
      <text class="mut" x="480" y="246" font-size="11" dominant-baseline="central">Handle</text>
      <rect class="box" x="480" y="254" width="300" height="34" rx="6"/>
      <text class="dim" x="492" y="271.5" font-size="12" dominant-baseline="central">alex-chen</text>
      <rect class="pan" x="480" y="316" width="300" height="76" rx="8"/>
      <text class="mut" x="494" y="342" font-size="11" dominant-baseline="central">Prefilled from the provider with your</text>
      <text class="mut" x="494" y="362" font-size="11" dominant-baseline="central">consent. Editable, and self-declared.</text>
      <rect class="acc" x="480" y="416" width="300" height="38" rx="6"/>
      <text class="w" x="630" y="435.5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Save profile</text>
      <text class="dim" x="630" y="480" font-size="11" text-anchor="middle" dominant-baseline="central">Role, skills and portfolio are edited on your profile page.</text>
      <line class="st" x1="51" y1="150" x2="58" y2="152"/>
      <circle class="acc" cx="40" cy="150" r="11"/>
      <text class="w" x="40" y="150.5" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
      <line class="st" x1="451" y1="150" x2="458" y2="152"/>
      <circle class="acc" cx="440" cy="150" r="11"/>
