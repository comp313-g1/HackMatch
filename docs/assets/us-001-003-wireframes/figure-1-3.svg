</style>
<rect x="0" y="0" width="860" height="560" fill="#ffffff"/>
      <title id="f13t">Figure 1.3 Wireframe: the two verification outcome branches</title>
      <desc>Left: the success state for a valid unused link. Right: the failure state for an expired or already used link, offering a replacement link.</desc>
      <rect class="box" x="0.5" y="0.5" width="859" height="559" rx="10"/>
      <line class="ln" x1="0.5" y1="34.5" x2="859.5" y2="34.5"/>
      <circle class="ph" cx="20" cy="17" r="4.5"/>
      <circle class="ph" cx="36" cy="17" r="4.5"/>
      <circle class="ph" cx="52" cy="17" r="4.5"/>
      <rect class="surf" x="70" y="7" width="380" height="20" rx="10"/>
      <text class="dim" x="82" y="17.5" font-size="11" dominant-baseline="central">hackmatch.app/verify-email/result</text>
      <rect class="surf" x="0" y="35" width="860" height="49"/>
      <line class="ln" x1="0" y1="84.5" x2="860" y2="84.5"/>
      <text x="24" y="59.5" font-size="15" font-weight="500" dominant-baseline="central">HackMatch</text>
      <text class="mut" x="60" y="112" font-size="11" dominant-baseline="central">On a valid, unused link</text>
      <text class="mut" x="460" y="112" font-size="11" dominant-baseline="central">On an expired, used, or tampered link</text>
      <rect class="box" x="60" y="124" width="340" height="376" rx="12"/>
      <circle class="okf" cx="230" cy="180" r="24"/>
      <path class="stk" d="M218 180 L226 188 L243 171"/>
      <text x="230" y="232" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central">Your email is verified</text>
      <text class="mut" x="230" y="258" font-size="12" text-anchor="middle" dominant-baseline="central">Your account is now a verified Participant.</text>
      <rect class="acc" x="100" y="288" width="260" height="38" rx="6"/>
      <text class="w" x="230" y="307.5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Continue to sign in</text>
      <rect class="pan" x="80" y="348" width="300" height="76" rx="8"/>
      <text class="mut" x="94" y="374" font-size="11" dominant-baseline="central">Verifying your email does not sign you in.</text>
      <text class="mut" x="94" y="394" font-size="11" dominant-baseline="central">You will still enter a login code.</text>
      <text class="dim" x="94" y="414" font-size="11" dominant-baseline="central">(US-001 AC 5)</text>
      <rect class="box" x="460" y="124" width="340" height="376" rx="12"/>
      <circle class="dgr" cx="630" cy="180" r="24"/>
      <path class="stx" d="M621 171 L639 189 M639 171 L621 189"/>
      <text x="630" y="232" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central">This link is no longer valid</text>
      <text class="mut" x="630" y="258" font-size="12" text-anchor="middle" dominant-baseline="central">It expired, was already used, or was tampered with.</text>
      <rect class="box" x="480" y="284" width="300" height="34" rx="6"/>
      <text class="dim" x="492" y="301.5" font-size="12" dominant-baseline="central">you@example.com</text>
      <rect class="acc" x="480" y="332" width="300" height="38" rx="6"/>
      <text class="w" x="630" y="351.5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Request a new link</text>
      <text class="dim" x="630" y="404" font-size="11" text-anchor="middle" dominant-baseline="central">Repeated requests are rate-limited.</text>
      <line class="st" x1="51" y1="150" x2="58" y2="152"/>
      <circle class="acc" cx="40" cy="150" r="11"/>
      <text class="w" x="40" y="150.5" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">1</text>
      <line class="st" x1="451" y1="150" x2="458" y2="152"/>
      <circle class="acc" cx="440" cy="150" r="11"/>
      <text class="w" x="440" y="150.5" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
      <line class="st" x1="451" y1="301" x2="476" y2="301"/>
      <circle class="acc" cx="440" cy="301" r="11"/>
      <text class="w" x="440" y="301.5" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
