      <line class="st" x1="202" y1="414" x2="232" y2="414"/>
      <circle class="acc" cx="186" cy="414" r="11"/>
      <text class="w" x="186" y="414.5" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">2</text>
      <line class="st" x1="202" y1="541" x2="232" y2="541"/>
      <circle class="acc" cx="186" cy="541" r="11"/>
      <text class="w" x="186" y="541.5" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">3</text>
