<rect x="0" y="0" width="860" height="620" fill="#ffffff"/>
      <title id="f11t">Figure 1.1 Wireframe: registration form page</title>
      <desc>The registration form has full name, email and password fields, a four-item password rules checklist below the password field, and Google and GitHub entry points at the bottom.</desc>
      <rect class="box" x="0.5" y="0.5" width="859" height="619" rx="10"/>
      <line class="ln" x1="0.5" y1="34.5" x2="859.5" y2="34.5"/>
      <circle class="ph" cx="20" cy="17" r="4.5"/>
      <circle class="ph" cx="36" cy="17" r="4.5"/>
      <circle class="ph" cx="52" cy="17" r="4.5"/>
      <rect class="surf" x="70" y="7" width="380" height="20" rx="10"/>
      <text class="dim" x="82" y="17.5" font-size="11" dominant-baseline="central">hackmatch.app/register</text>
      <rect class="surf" x="0" y="35" width="860" height="49"/>
      <line class="ln" x1="0" y1="84.5" x2="860" y2="84.5"/>
      <text x="24" y="59.5" font-size="15" font-weight="500" dominant-baseline="central">HackMatch</text>
      <text class="mut" x="590" y="59.5" font-size="12" dominant-baseline="central">Events</text>
      <text class="mut" x="658" y="59.5" font-size="12" dominant-baseline="central">Teams</text>
      <rect class="box" x="730" y="45" width="106" height="28" rx="6"/>
      <text class="mut" x="783" y="59.5" font-size="12" text-anchor="middle" dominant-baseline="central">Sign in</text>
      <rect class="box" x="210" y="104" width="440" height="496" rx="12"/>
      <text x="238" y="142" font-size="18" font-weight="500" dominant-baseline="central">Create your participant account</text>
      <text class="mut" x="238" y="166" font-size="12" dominant-baseline="central">Find a team, or recruit for a verified event.</text>
      <text class="mut" x="238" y="200" font-size="11" dominant-baseline="central">Full name</text>
      <rect class="box" x="238" y="208" width="384" height="34" rx="6"/>
      <text class="dim" x="250" y="225.5" font-size="12" dominant-baseline="central">Alex Chen</text>
      <text class="mut" x="238" y="262" font-size="11" dominant-baseline="central">Email</text>
      <rect class="box" x="238" y="270" width="384" height="34" rx="6"/>
      <text class="dim" x="250" y="287.5" font-size="12" dominant-baseline="central">you@example.com</text>
      <text class="dim" x="238" y="320" font-size="11" dominant-baseline="central">Academic email is optional</text>
      <text class="mut" x="238" y="344" font-size="11" dominant-baseline="central">Password</text>
      <rect class="box" x="238" y="352" width="384" height="34" rx="6"/>
      <text class="dim" x="250" y="369.5" font-size="14" dominant-baseline="central">••••••••••</text>
      <text class="ac" x="610" y="369.5" font-size="11" text-anchor="end" dominant-baseline="central">Show</text>
      <circle class="st" cx="244" cy="404" r="5"/>
      <text class="mut" x="256" y="404" font-size="11" dominant-baseline="central">8+ characters</text>
      <circle class="st" cx="244" cy="424" r="5"/>
      <text class="mut" x="256" y="424" font-size="11" dominant-baseline="central">Upper and lowercase</text>
      <circle class="st" cx="440" cy="404" r="5"/>
      <text class="mut" x="452" y="404" font-size="11" dominant-baseline="central">At least one digit</text>
      <circle class="st" cx="440" cy="424" r="5"/>
      <text class="mut" x="452" y="424" font-size="11" dominant-baseline="central">Special character</text>
      <rect class="acc" x="238" y="450" width="384" height="38" rx="6"/>
      <text class="w" x="430" y="469.5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Create account</text>
      <line class="ln" x1="238" y1="508" x2="406" y2="508"/>
      <text class="dim" x="430" y="508" font-size="11" text-anchor="middle" dominant-baseline="central">or</text>
      <line class="ln" x1="454" y1="508" x2="622" y2="508"/>
      <rect class="box" x="238" y="524" width="186" height="34" rx="6"/>
      <text class="mut" x="331" y="541.5" font-size="12" text-anchor="middle" dominant-baseline="central">Continue with Google</text>
      <rect class="box" x="436" y="524" width="186" height="34" rx="6"/>
      <text class="mut" x="529" y="541.5" font-size="12" text-anchor="middle" dominant-baseline="central">Continue with GitHub</text>
      <text class="dim" x="430" y="580" font-size="11" text-anchor="middle" dominant-baseline="central">Already have an account?  Sign in</text>
      <line class="st" x1="202" y1="320" x2="232" y2="320"/>
      <circle class="acc" cx="186" cy="320" r="11"/>
