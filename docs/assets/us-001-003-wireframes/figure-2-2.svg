<rect x="0" y="0" width="860" height="540" fill="#ffffff"/>
      <title id="f22t">Figure 2.2 Wireframe: the two authorization callback branches</title>
      <desc>Left: the waiting state while the provider handshake runs. Right: the guidance state shown when the provider returns no verified email.</desc>
      <rect class="box" x="0.5" y="0.5" width="859" height="539" rx="10"/>
      <line class="ln" x1="0.5" y1="34.5" x2="859.5" y2="34.5"/>
      <circle class="ph" cx="20" cy="17" r="4.5"/>
      <circle class="ph" cx="36" cy="17" r="4.5"/>
      <circle class="ph" cx="52" cy="17" r="4.5"/>
      <rect class="surf" x="70" y="7" width="380" height="20" rx="10"/>
      <text class="dim" x="82" y="17.5" font-size="11" dominant-baseline="central">hackmatch.app/auth/callback</text>
      <rect class="surf" x="0" y="35" width="860" height="49"/>
      <line class="ln" x1="0" y1="84.5" x2="860" y2="84.5"/>
      <text x="24" y="59.5" font-size="15" font-weight="500" dominant-baseline="central">HackMatch</text>
      <text class="mut" x="60" y="108" font-size="11" dominant-baseline="central">While the provider handshake runs</text>
      <text class="mut" x="460" y="108" font-size="11" dominant-baseline="central">When the provider has no verified email</text>
      <rect class="box" x="60" y="120" width="340" height="380" rx="12"/>
      <circle class="st" cx="230" cy="190" r="24"/>
      <path class="sp" d="M230 166 A24 24 0 0 1 254 190"/>
      <text x="230" y="246" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central">Connecting to Google</text>
      <text class="mut" x="230" y="270" font-size="12" text-anchor="middle" dominant-baseline="central">Do not close this window.</text>
      <rect class="pan" x="80" y="310" width="300" height="70" rx="8"/>
      <text class="mut" x="94" y="336" font-size="11" dominant-baseline="central">Cancelling or a provider failure returns</text>
      <text class="mut" x="94" y="354" font-size="11" dominant-baseline="central">an actionable error and creates</text>
      <text class="mut" x="94" y="372" font-size="11" dominant-baseline="central">no session.</text>
      <rect class="box" x="460" y="120" width="340" height="380" rx="12"/>
      <circle class="dgr" cx="630" cy="190" r="24"/>
      <path class="stx" d="M621 181 L639 199 M639 181 L621 199"/>
      <text x="630" y="246" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">We could not confirm your email</text>
      <text class="mut" x="630" y="270" font-size="12" text-anchor="middle" dominant-baseline="central">The provider did not return a verified address.</text>
      <rect class="acc" x="480" y="300" width="300" height="38" rx="6"/>
      <text class="w" x="630" y="319.5" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">Continue with email registration</text>
      <rect class="box" x="480" y="348" width="300" height="34" rx="6"/>
      <text class="mut" x="630" y="365.5" font-size="12" text-anchor="middle" dominant-baseline="central">Try a different account</text>
      <rect class="pan" x="480" y="398" width="300" height="70" rx="8"/>
      <text class="mut" x="494" y="428" font-size="11" dominant-baseline="central">Sign-in stays unavailable until your email</text>
      <text class="mut" x="494" y="448" font-size="11" dominant-baseline="central">address is verified through registration.</text>
      <line class="st" x1="51" y1="150" x2="58" y2="152"/>
